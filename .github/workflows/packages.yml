name: Packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  deb-rpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.2
      - name: Build packages
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.2.0' }}
        run: |
          VERSION="${VERSION#v}"
          export VERSION
          export PATH="$PATH:$(go env GOPATH)/bin"
          chmod +x scripts/package.sh packaging/scripts/postinstall.sh
          ./scripts/package.sh
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: auth-chaser-packages
          path: |
            dist/*.deb
            dist/*.rpm
