name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "netlify.toml"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "website/**"
      - "netlify.toml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: website-out
          path: website/out
